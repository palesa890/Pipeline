name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ticketing
          POSTGRES_USER: ticketing
          POSTGRES_PASSWORD: ticketing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketing -d ticketing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ci-only-secret-key
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: flake8 .
      - name: Run tests
        run: pytest --cov=apps.core --cov-report=term-missing --cov-fail-under=90
      - name: Build Docker image
        run: docker build --tag halcyon-ticketing:${{ github.sha }} .
